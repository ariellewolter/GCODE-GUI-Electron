name: Build and Release macOS App

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller gcode_generator.spec

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Codesign app
        env:
          SIGN_ID: "Developer ID Application: Arielle Wolter (74MA96HS7Z)"
        run: |
          APP="$(find dist -maxdepth 3 -name '*.app' -print -quit)"
          echo "Found APP: $APP"
          test -n "$APP"

          xattr -cr "$APP" || true
          codesign --force --deep --timestamp --options runtime --sign "$SIGN_ID" "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Create zip for notarization
        run: |
          APP="$(find dist -maxdepth 3 -name '*.app' -print -quit)"
          echo "Zipping APP: $APP"
          test -n "$APP"

          ditto -c -k --keepParent "$APP" GCodeGenerator.zip


      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit GCodeGenerator.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple notarization
        run: |
          xcrun stapler staple "dist/GCode Generator.app"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: GCodeGenerator.zip
